<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Subtitle Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Left panel - Video */
    .video-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d0d1a;
      min-width: 0;
    }

    .video-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 0;
    }

    .video-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      display: block;
      background: black;
      border-radius: 8px;
    }

    /* Subtitle Overlay - Matching Presenter Mode */
    .subtitle-overlay {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 30px 20px;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .subtitle-overlay.bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
    }

    .subtitle-overlay.middle {
      top: 50%;
      transform: translateY(-50%);
    }

    .subtitle-overlay.top {
      top: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
    }

    .subtitle-text {
      font-family: Arial, 'Segoe UI', -apple-system, sans-serif;
      font-weight: 700;
      color: white;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.02em;
      padding: 12px 20px;
      max-width: 90%;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 4px;
    }

    .subtitle-text .word {
      display: inline-block;
      transition: all 0.1s ease;
      margin: 0 0.1em;
    }

    /* Current word - highlight color, slightly larger */
    .subtitle-text .word.current {
      transform: scale(1.1);
    }

    /* Already spoken words - full brightness */
    .subtitle-text .word.spoken {
      color: white;
    }

    /* Upcoming words - dimmed */
    .subtitle-text .word.upcoming {
      opacity: 0.6;
    }

    /* Settings Panel */
    .settings-panel {
      background: linear-gradient(135deg, #1e3a5f 0%, #16213e 100%);
      border-top: 1px solid rgba(139, 92, 246, 0.3);
      padding: 16px 20px;
    }

    .settings-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-group label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
    }

    .setting-group select,
    .setting-group input[type="range"] {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
    }

    .setting-group select:focus,
    .setting-group input:focus {
      outline: none;
      border-color: #8b5cf6;
    }

    .setting-group input[type="range"] {
      padding: 0;
      height: 36px;
      cursor: pointer;
    }

    .setting-value {
      font-size: 0.85rem;
      color: #a78bfa;
      font-weight: 600;
    }

    /* Right panel - Editor */
    .editor-panel {
      width: 420px;
      background: #16213e;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .editor-header {
      padding: 16px 20px;
      background: #1a1a2e;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .subtitle-count {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      background: rgba(139, 92, 246, 0.15);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .subtitle-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .subtitle-item {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .subtitle-item:hover {
      border-color: rgba(139, 92, 246, 0.4);
      background: rgba(139, 92, 246, 0.05);
    }

    .subtitle-item.active {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.15);
    }

    .subtitle-time {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.75rem;
      color: #8b5cf6;
      margin-bottom: 8px;
    }

    .subtitle-text-edit {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: white;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
    }

    .subtitle-text-edit:focus {
      outline: none;
      border-color: #8b5cf6;
    }

    .subtitle-words {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .word-chip {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 7px;
      border-radius: 4px;
      color: rgba(255,255,255,0.7);
      transition: all 0.15s;
    }

    .word-chip.current {
      background: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
      transform: scale(1.05);
    }

    .word-chip.spoken {
      background: rgba(139, 92, 246, 0.2);
      color: rgba(255,255,255,0.9);
    }

    /* Action buttons */
    .action-bar {
      padding: 16px 20px;
      background: #1a1a2e;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }

    /* Status messages */
    .status {
      padding: 12px 20px;
      font-size: 0.85rem;
      text-align: center;
    }

    .status.info {
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px;
      color: rgba(255,255,255,0.6);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }
      .editor-panel {
        width: 100%;
        max-height: 50vh;
      }
      .settings-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Video Panel -->
    <div class="video-panel">
      <div class="video-wrapper">
        <div class="video-container">
          <video id="video" controls>
            <source src="/video" type="video/mp4">
          </video>
          <div id="subtitle-overlay" class="subtitle-overlay bottom">
            <div id="subtitle-text" class="subtitle-text" style="display: none;"></div>
          </div>
        </div>
      </div>
      
      <!-- Settings Panel - Prominent placement -->
      <div class="settings-panel">
        <div class="settings-title">Subtitle Settings</div>
        <div class="settings-grid">
          <div class="setting-group">
            <label>Font Size</label>
            <input type="range" id="font-size" min="8" max="72" value="42">
            <span class="setting-value" id="font-size-value">42px</span>
          </div>
          
          <div class="setting-group">
            <label>Position</label>
            <select id="position">
              <option value="bottom">Bottom</option>
              <option value="middle">Middle</option>
              <option value="top">Top</option>
            </select>
          </div>
          
          <div class="setting-group">
            <label>Highlight Color</label>
            <select id="highlight-color">
              <option value="#fbbf24">Yellow (default)</option>
              <option value="#f472b6">Pink</option>
              <option value="#34d399">Green</option>
              <option value="#60a5fa">Blue</option>
              <option value="#ffffff">White</option>
            </select>
          </div>
          
          <div class="setting-group">
            <label>Text Color</label>
            <select id="text-color">
              <option value="white">White</option>
              <option value="#e2e8f0">Light Gray</option>
            </select>
          </div>
          
          <div class="setting-group">
            <label>Word Highlighting</label>
            <select id="word-highlighting">
              <option value="true">On (slower encode)</option>
              <option value="false">Off (much faster)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Editor Panel -->
    <div class="editor-panel">
      <div class="editor-header">
        <h2>Subtitles</h2>
        <span class="subtitle-count" id="subtitle-count">0 segments</span>
      </div>
      
      <div id="subtitle-list" class="subtitle-list">
        <div class="loading">
          <div class="spinner"></div>
          <span>Loading transcription...</span>
        </div>
      </div>
      
      <div id="status" class="status" style="display: none;"></div>
      
      <div class="action-bar" style="flex-wrap: wrap;">
        <input type="file" id="import-json-input" accept=".json" style="display: none;">
        <button id="import-json" class="btn btn-secondary" title="Load previous transcription">Load JSON</button>
        <button id="export-json" class="btn btn-secondary" title="Save with word timing">Save JSON</button>
        <button id="export-srt" class="btn btn-secondary" title="Export SRT (no word timing)">SRT</button>
        <button id="approve-btn" class="btn btn-primary">Burn Subtitles (Exact Match)</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let subtitles = [];
    let settings = {
      font_size: 42,
      position: 'bottom',
      highlight_color: '#fbbf24',
      text_color: 'white',
      word_highlighting: true,
    };
    let currentSubtitleIndex = -1;
    let currentWordIndex = -1;

    // DOM elements
    const video = document.getElementById('video');
    const subtitleOverlay = document.getElementById('subtitle-overlay');
    const subtitleText = document.getElementById('subtitle-text');
    const subtitleList = document.getElementById('subtitle-list');
    const subtitleCount = document.getElementById('subtitle-count');
    const fontSizeInput = document.getElementById('font-size');
    const fontSizeValue = document.getElementById('font-size-value');
    const positionSelect = document.getElementById('position');
    const highlightColorSelect = document.getElementById('highlight-color');
    const textColorSelect = document.getElementById('text-color');
    const approveBtn = document.getElementById('approve-btn');
    const exportSrtBtn = document.getElementById('export-srt');
    const statusEl = document.getElementById('status');

    // Load data from server
    async function loadData() {
      try {
        const response = await fetch('/api/data');
        const data = await response.json();
        
        subtitles = data.subtitles;
        
        // Merge server settings with defaults
        if (data.settings) {
          settings = { ...settings, ...data.settings };
        }
        
        // Update UI controls
        fontSizeInput.value = settings.font_size;
        fontSizeValue.textContent = settings.font_size + 'px';
        positionSelect.value = settings.position;
        if (settings.highlight_color) highlightColorSelect.value = settings.highlight_color;
        if (settings.text_color) textColorSelect.value = settings.text_color;
        
        renderSubtitleList();
        updateSubtitleStyle();
        
        subtitleCount.textContent = `${subtitles.length} segments`;
      } catch (error) {
        console.error('Failed to load data:', error);
        subtitleList.innerHTML = '<div class="status error">Failed to load transcription</div>';
      }
    }

    // Render subtitle list
    function renderSubtitleList() {
      subtitleList.innerHTML = '';
      
      subtitles.forEach((sub, index) => {
        const item = document.createElement('div');
        item.className = 'subtitle-item' + (index === currentSubtitleIndex ? ' active' : '');
        item.dataset.index = index;
        
        const formatTime = (t) => {
          const m = Math.floor(t / 60);
          const s = (t % 60).toFixed(2);
          return `${m}:${s.padStart(5, '0')}`;
        };
        
        item.innerHTML = `
          <div class="subtitle-time">${formatTime(sub.start)} → ${formatTime(sub.end)}</div>
          <textarea class="subtitle-text-edit" rows="2" data-index="${index}">${sub.text}</textarea>
          <div class="subtitle-words" data-index="${index}">
            ${(sub.words || []).map((w, i) => 
              `<span class="word-chip" data-word-index="${i}">${w.word}</span>`
            ).join('')}
          </div>
        `;
        
        // Click to seek
        item.addEventListener('click', (e) => {
          if (e.target.tagName !== 'TEXTAREA') {
            video.currentTime = sub.start;
            video.play();
          }
        });
        
        // Edit text
        const textarea = item.querySelector('textarea');
        textarea.addEventListener('input', (e) => {
          subtitles[index].text = e.target.value;
        });
        
        subtitleList.appendChild(item);
      });
    }

    // Update subtitle display based on video time
    function updateSubtitleDisplay() {
      const time = video.currentTime;
      
      // Find current subtitle
      let foundSub = null;
      let foundIndex = -1;
      
      for (let i = 0; i < subtitles.length; i++) {
        if (time >= subtitles[i].start && time <= subtitles[i].end) {
          foundSub = subtitles[i];
          foundIndex = i;
          break;
        }
      }
      
      if (!foundSub) {
        subtitleText.style.display = 'none';
        currentSubtitleIndex = -1;
        currentWordIndex = -1;
        updateActiveSubtitleInList(-1, -1);
        return;
      }
      
      subtitleText.style.display = 'block';
      
      // Update active subtitle in list
      if (foundIndex !== currentSubtitleIndex) {
        currentSubtitleIndex = foundIndex;
        
        // Scroll into view
        const activeItem = subtitleList.querySelector(`[data-index="${foundIndex}"]`);
        if (activeItem) {
          activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
      
      // Render with word highlighting
      const words = foundSub.words || [];
      if (words.length === 0) {
        subtitleText.innerHTML = `<span class="word current">${foundSub.text}</span>`;
        updateActiveSubtitleInList(foundIndex, -1);
        return;
      }
      
      // Find current word based on time
      let activeWordIndex = -1;
      for (let i = 0; i < words.length; i++) {
        if (time >= words[i].start && time < words[i].end) {
          activeWordIndex = i;
          break;
        }
        // If we're past this word but before the next, still highlight this word
        if (time >= words[i].end && (i === words.length - 1 || time < words[i + 1].start)) {
          activeWordIndex = i;
          break;
        }
      }
      
      // If before first word, highlight first
      if (activeWordIndex === -1 && time < words[0].start) {
        activeWordIndex = 0;
      }
      
      // Build HTML with proper word classes
      const highlightColor = settings.highlight_color || '#fbbf24';
      let html = words.map((w, i) => {
        let className = 'word';
        let style = '';
        
        if (i === activeWordIndex) {
          className += ' current';
          style = `color: ${highlightColor}; text-shadow: 0 0 20px ${highlightColor}80, 0 0 40px ${highlightColor}50, 0 4px 8px rgba(0,0,0,0.8);`;
        } else if (i < activeWordIndex) {
          className += ' spoken';
        } else {
          className += ' upcoming';
        }
        
        return `<span class="${className}" style="${style}">${w.word}</span>`;
      }).join(' ');
      
      subtitleText.innerHTML = html;
      
      // Update word chips in list
      updateActiveSubtitleInList(foundIndex, activeWordIndex);
    }

    // Update active subtitle and word in list
    function updateActiveSubtitleInList(subIndex, wordIndex) {
      // Update subtitle items
      document.querySelectorAll('.subtitle-item').forEach((item, i) => {
        item.classList.toggle('active', i === subIndex);
      });
      
      // Update word chips
      document.querySelectorAll('.word-chip').forEach(chip => {
        chip.classList.remove('current', 'spoken');
      });
      
      if (subIndex >= 0) {
        const wordsContainer = subtitleList.querySelector(`.subtitle-words[data-index="${subIndex}"]`);
        if (wordsContainer) {
          wordsContainer.querySelectorAll('.word-chip').forEach((chip, i) => {
            if (i === wordIndex) {
              chip.classList.add('current');
            } else if (i < wordIndex) {
              chip.classList.add('spoken');
            }
          });
        }
      }
    }

    // Update subtitle styling
    function updateSubtitleStyle() {
      subtitleText.style.fontSize = settings.font_size + 'px';
      subtitleText.style.color = settings.text_color;
      
      // Position
      subtitleOverlay.className = 'subtitle-overlay ' + settings.position;
    }

    // Settings change handlers
    fontSizeInput.addEventListener('input', () => {
      settings.font_size = parseInt(fontSizeInput.value);
      fontSizeValue.textContent = settings.font_size + 'px';
      updateSubtitleStyle();
    });

    positionSelect.addEventListener('change', () => {
      settings.position = positionSelect.value;
      updateSubtitleStyle();
    });

    highlightColorSelect.addEventListener('change', () => {
      settings.highlight_color = highlightColorSelect.value;
      updateSubtitleDisplay(); // Re-render to apply new color
    });

    textColorSelect.addEventListener('change', () => {
      settings.text_color = textColorSelect.value;
      updateSubtitleStyle();
    });

    document.getElementById('word-highlighting').addEventListener('change', (e) => {
      settings.word_highlighting = e.target.value === 'true';
    });

    // Video time update - use requestAnimationFrame for smoother updates
    let lastUpdateTime = 0;
    video.addEventListener('timeupdate', () => {
      const now = performance.now();
      if (now - lastUpdateTime > 50) { // Update max 20fps
        lastUpdateTime = now;
        updateSubtitleDisplay();
      }
    });
    
    // Also update on play to catch immediate changes
    video.addEventListener('play', updateSubtitleDisplay);
    video.addEventListener('seeked', updateSubtitleDisplay);

    // Import JSON
    document.getElementById('import-json').addEventListener('click', () => {
      document.getElementById('import-json-input').click();
    });
    
    document.getElementById('import-json-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        
        if (!data.subtitles) {
          alert('Invalid JSON file - missing subtitles');
          return;
        }
        
        subtitles = data.subtitles;
        if (data.settings) {
          settings = { ...settings, ...data.settings };
          // Update UI controls
          fontSizeInput.value = settings.font_size;
          fontSizeValue.textContent = settings.font_size + 'px';
          positionSelect.value = settings.position;
          if (settings.highlight_color) highlightColorSelect.value = settings.highlight_color;
          if (settings.text_color) textColorSelect.value = settings.text_color;
          updateSubtitleStyle();
        }
        
        renderSubtitleList();
        subtitleCount.textContent = `${subtitles.length} segments`;
        showStatus(`Loaded ${subtitles.length} subtitles from ${file.name}`, 'success');
        
        // Reset button state
        approveBtn.disabled = false;
        approveBtn.textContent = 'Burn Subtitles';
        
      } catch (err) {
        alert('Failed to parse JSON: ' + err.message);
      }
      
      // Clear the input so same file can be selected again
      e.target.value = '';
    });

    // Export JSON (with word timing)
    document.getElementById('export-json').addEventListener('click', () => {
      window.location.href = '/api/export-json';
    });

    // Export SRT (loses word timing)
    exportSrtBtn.addEventListener('click', () => {
      window.location.href = '/api/export-srt';
    });

    // Approve and export - render subtitles to video overlay
    approveBtn.addEventListener('click', async () => {
      approveBtn.disabled = true;
      approveBtn.textContent = 'Recording subtitles...';
      showStatus('Step 1/3: Recording subtitle overlay (plays video in real-time)...', 'info');
      
      try {
        // Record subtitle overlay as WebM with transparency
        const subtitleBlob = await recordSubtitleOverlay();
        
        showStatus('Step 2/3: Uploading subtitle overlay...', 'info');
        approveBtn.textContent = 'Uploading...';
        
        // Upload to server
        const formData = new FormData();
        formData.append('overlay', subtitleBlob, 'subtitles.webm');
        formData.append('settings', JSON.stringify(settings));
        
        const response = await fetch('/api/composite', {
          method: 'POST',
          body: formData,
        });
        
        showStatus('Step 3/3: Server compositing video (this may take a while)...', 'info');
        approveBtn.textContent = 'Compositing...';
        
        const result = await response.json();
        
        if (result.status === 'ok') {
          showStatus(`Done! Video saved to: ${result.output}`, 'success');
          approveBtn.textContent = 'Burn Again';
          approveBtn.disabled = false;
        } else {
          throw new Error(result.message || 'Export failed');
        }
      } catch (error) {
        showStatus('Export failed: ' + error.message, 'error');
        approveBtn.disabled = false;
        approveBtn.textContent = 'Burn Subtitles (Exact Match)';
      }
    });
    
    // Record subtitle overlay - SIMPLE approach using the actual visible element
    async function recordSubtitleOverlay() {
      return new Promise(async (resolve, reject) => {
        try {
          const videoWidth = video.videoWidth || 1920;
          const videoHeight = video.videoHeight || 1080;
          
          // Get the actual video container dimensions
          const videoRect = video.getBoundingClientRect();
          const scaleX = videoWidth / videoRect.width;
          const scaleY = videoHeight / videoRect.height;
          
          // Create recording canvas at video resolution
          const canvas = document.createElement('canvas');
          canvas.width = videoWidth;
          canvas.height = videoHeight;
          const ctx = canvas.getContext('2d');
          
          // Style the subtitle text for recording (match video resolution)
          const scaledFontSize = (settings.font_size || 42);
          
          // Set up MediaRecorder
          const stream = canvas.captureStream(30);
          let mimeType = 'video/webm;codecs=vp9';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm;codecs=vp8';
          }
          
          const recorder = new MediaRecorder(stream, {
            mimeType: mimeType,
            videoBitsPerSecond: 8000000,
          });
          
          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };
          
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            resolve(blob);
          };
          
          recorder.start(100);
          
          // Play video
          video.currentTime = 0;
          video.muted = true;
          await new Promise(r => { video.onseeked = r; });
          await video.play();
          
          function renderFrame() {
            if (video.ended || video.paused) {
              recorder.stop();
              video.muted = false;
              return;
            }
            
            // Clear canvas (transparent)
            ctx.clearRect(0, 0, videoWidth, videoHeight);
            
            const time = video.currentTime;
            
            // Find current subtitle
            let currentSub = null;
            for (const sub of subtitles) {
              if (time >= sub.start && time <= sub.end) {
                currentSub = sub;
                break;
              }
            }
            
            if (currentSub) {
              drawSubtitle(ctx, currentSub, time, videoWidth, videoHeight, scaledFontSize);
            }
            
            // Progress
            const pct = Math.min(100, (time / video.duration) * 100);
            showStatus(`Step 1/3: Recording subtitles... ${pct.toFixed(0)}%`, 'info');
            
            requestAnimationFrame(renderFrame);
          }
          
          renderFrame();
          
        } catch (error) {
          reject(error);
        }
      });
    }
    
    // Draw subtitle to canvas - EXACTLY matching the CSS rendering
    function drawSubtitle(ctx, sub, time, width, height, fontSize) {
      const words = sub.words || [];
      const position = settings.position || 'bottom';
      const highlightColor = settings.highlight_color || '#fbbf24';
      const textColor = settings.text_color || 'white';
      
      // Find current word index
      let currentWordIndex = -1;
      if (words.length > 0) {
        for (let i = 0; i < words.length; i++) {
          if (time >= words[i].start && time < words[i].end) {
            currentWordIndex = i;
            break;
          }
          if (time >= words[i].end && (i === words.length - 1 || time < words[i + 1].start)) {
            currentWordIndex = i;
            break;
          }
        }
        if (currentWordIndex === -1 && words.length > 0 && time < words[0].start) {
          currentWordIndex = 0;
        }
      }
      
      // Set up font
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.textBaseline = 'middle';
      
      // Build word list with colors
      const wordList = words.length > 0 
        ? words.map((w, i) => ({ 
            text: w.word, 
            isHighlight: i === currentWordIndex,
            isSpoken: i < currentWordIndex,
            isUpcoming: i > currentWordIndex
          }))
        : [{ text: sub.text, isHighlight: true, isSpoken: false, isUpcoming: false }];
      
      // Measure total width
      const padding = 16;
      const wordSpacing = fontSize * 0.3;
      let totalTextWidth = 0;
      const wordWidths = [];
      
      for (let i = 0; i < wordList.length; i++) {
        const w = ctx.measureText(wordList[i].text).width;
        wordWidths.push(w);
        totalTextWidth += w;
        if (i < wordList.length - 1) totalTextWidth += wordSpacing;
      }
      
      const boxWidth = totalTextWidth + padding * 2;
      const boxHeight = fontSize * 1.8;
      
      // Position
      const centerX = width / 2;
      let centerY;
      if (position === 'bottom') {
        centerY = height - 60 - boxHeight / 2;
      } else if (position === 'top') {
        centerY = 60 + boxHeight / 2;
      } else {
        centerY = height / 2;
      }
      
      // Draw background box
      const boxX = centerX - boxWidth / 2;
      const boxY = centerY - boxHeight / 2;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 6);
      ctx.fill();
      
      // Draw each word
      let x = centerX - totalTextWidth / 2;
      
      for (let i = 0; i < wordList.length; i++) {
        const word = wordList[i];
        const wordWidth = wordWidths[i];
        
        ctx.save();
        
        if (word.isHighlight) {
          // Highlighted word - yellow, scaled up
          ctx.fillStyle = highlightColor;
          const scale = 1.1;
          ctx.translate(x + wordWidth / 2, centerY);
          ctx.scale(scale, scale);
          ctx.translate(-(x + wordWidth / 2), -centerY);
        } else if (word.isUpcoming) {
          // Upcoming - dimmed
          ctx.fillStyle = textColor;
          ctx.globalAlpha = 0.6;
        } else {
          // Spoken - full white
          ctx.fillStyle = textColor;
        }
        
        ctx.fillText(word.text, x, centerY);
        ctx.restore();
        
        x += wordWidth + wordSpacing;
      }
    }

    // Show status message
    function showStatus(message, type = 'info') {
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
      statusEl.style.display = 'block';
    }

    // Initialize
    loadData();
  </script>
